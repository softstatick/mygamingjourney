<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MyGamingJourney{% endblock %} — Show Your Skill. Get Scouted.</title>
    
   <!-- Google Fonts: Russo One (heading) + Poppins (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- AOS (Animate On Scroll) -->
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- ==================== NAVBAR ==================== -->
    <header class="navbar">
        <div class="nav-container">
            <a href="{{ url_for('main.home') }}" class="brand">
                <span class="brand-mark">MJ</span>
                <span>MYGAMING<span class="brand-accent">JOURNEY</span></span>
            </a>
            
            <nav class="nav-links">
                <a href="{{ url_for('main.home') }}">HOME</a>
                <a href="#">GAMER DIRECTORY</a>
                <a href="#">ABOUT</a>
                
                {% if current_user.is_authenticated %}
                    <a href="#">MY PORTFOLIO</a>
                    <a href="#" class="nav-cta">LOG OUT</a>
                {% else %}
                    <a href="#">LOG IN</a>
                    <a href="#" class="nav-cta">
                        JOIN THE ARENA <i class="fa-solid fa-arrow-right"></i>
                    </a>
                {% endif %}
                
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <i class="fa-solid fa-sun"></i>
                </button>
            </nav>
        </div>
    </header>

    <!-- ==================== MAIN CONTENT ==================== -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- ==================== FOOTER ==================== -->
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-brand">
                <span class="brand-mark">MJ</span>
                <span>MYGAMING<span class="brand-accent">JOURNEY</span></span>
            </div>
            <p class="footer-tagline">Show Your Skill. Get Scouted.</p>
            <small>© 2026 MyGamingJourney · Built for Indonesia's next generation</small>
        </div>
    </footer>

    <!-- ==================== SCRIPTS ==================== -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
